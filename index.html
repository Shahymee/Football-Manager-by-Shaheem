<!DOCTYPE html>
<html>

<head>
<title>Dream XI Manager</title>
<link rel="stylesheet" href="style.css">
</head>


<body>


<h1>⚽ Dream XI Manager</h1>


<div class="box">

<h2>Create Club</h2>

<input id="clubName" placeholder="Club Name">


<select id="formation">

<option>4-3-3</option>
<option>4-2-3-1</option>
<option>3-5-2</option>
<option>4-4-2</option>

</select>


<button onclick="startGame()">
Create Club
</button>

</div>




<div id="pitchContainer" style="display:none">


<h2 id="clubTitle"></h2>


<div class="pitch">


<div class="position st" onclick="selectPosition('ST')">
ST<br>
<span id="ST">+</span>
</div>


<div class="position lw" onclick="selectPosition('LW')">
LW<br>
<span id="LW">+</span>
</div>


<div class="position rw" onclick="selectPosition('RW')">
RW<br>
<span id="RW">+</span>
</div>


<div class="position cm1" onclick="selectPosition('CM1')">
CM<br>
<span id="CM1">+</span>
</div>


<div class="position cm2" onclick="selectPosition('CM2')">
CM<br>
<span id="CM2">+</span>
</div>


<div class="position cdm" onclick="selectPosition('CDM')">
CDM<br>
<span id="CDM">+</span>
</div>


<div class="position lb" onclick="selectPosition('LB')">
LB<br>
<span id="LB">+</span>
</div>


<div class="position cb1" onclick="selectPosition('CB1')">
CB<br>
<span id="CB1">+</span>
</div>


<div class="position cb2" onclick="selectPosition('CB2')">
CB<br>
<span id="CB2">+</span>
</div>


<div class="position rb" onclick="selectPosition('RB')">
RB<br>
<span id="RB">+</span>
</div>


<div class="position gk" onclick="selectPosition('GK')">
GK<br>
<span id="GK">+</span>
</div>


</div>



<button onclick="startSeason()">
🏆 Start Season
</button>


</div>




<div id="seasonArea" style="display:none">


<div class="box">

<h2>📅 Fixtures & Results</h2>

<button onclick="playNextMatch()">
▶ Play Next Match
</button>


<div id="fixtures">

No fixtures yet

</div>


</div>





<div class="box">


<h2>🏆 League Table</h2>


<table id="leagueTable">


<tr>

<th>Pos</th>
<th>Team</th>
<th>P</th>
<th>W</th>
<th>D</th>
<th>L</th>
<th>GD</th>
<th>Pts</th>

</tr>


</table>


</div>



</div>





<div class="box">


<h2>Match Result</h2>

<p id="result">
No match played yet
</p>


</div>




<script src="game.js"></script>


</body>

</html>
